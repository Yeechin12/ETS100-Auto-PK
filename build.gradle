plugins {
    // Compose 1.12.0 与 androidx.core 1.19.0 都要求 AGP 9.1.0+，而液态玻璃库
    // io.github.kyant0:backdrop:2.0.1 依赖的正是 CMP 1.12.0（在 Android 上即 AndroidX
    // Compose 1.12.0），所以 AGP 必须升到 9.3.2 —— 也就是该库自身使用的版本。
    id 'com.android.application' version '9.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10' apply false
}
