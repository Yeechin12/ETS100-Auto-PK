org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true

# AGP 9 默认启用「内置 Kotlin」，其 Kotlin 版本由 AGP 决定、项目无法指定。
# 而 io.github.kyant0:backdrop:2.0.1 是用 Kotlin 2.4.10 编译的，元数据版本较新，
# 低版本编译器会报 "compiled by a newer version of Kotlin"（AGP 9.0.1 内置的是 2.2.10）。
# 所以这里退出内置 Kotlin，改由根 build.gradle 显式声明 Kotlin 2.4.10，
# 与 Compose 编译器插件版本保持一致。
# 注意：AGP 的 kotlin-android 插件与 9.0 的新 DSL 不兼容，因此还需关掉 newDsl。
# 这两项在 AGP 10 会被移除，届时需要迁移到内置 Kotlin（并同步提升 backdrop 的最低 Kotlin 版本要求）。
android.builtInKotlin=false
android.newDsl=false
